<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- 空 favicon 声明：抑制浏览器对 /favicon.ico 的自动探测——凭据模式下该路径在
         Basic 闸内，每次页面加载都会白刷一条 401 auth_failed 日志并白计一次节流失败
         （2026-08-22 实测定位；data: URL 零网络请求零鉴权面变化） -->
    <link rel="icon" href="data:," />
    <!-- 苹果图标同样声明空 data URL（2026-09-13）：iOS 系统进程会不带凭据抓
         /apple-touch-icon*.png，声明后浏览器不再发该请求（服务端另有 204 豁免兜底）。
         apple-mobile-web-app-capable 使「添加到主屏幕」以独立窗口全屏运行。 -->
    <link rel="apple-touch-icon" href="data:," />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>wesh</title>
    <style>
      /* singlefile 保证 CSS 先于 JS 内联——无白闪契约（body 背景与终端同色 #000000） */
      html, body { margin: 0; padding: 0; height: 100%; background: #000000; overflow: hidden; }
      #terminal { width: 100%; height: 100%; }
      /* #status 状态面板（默认 hidden）：全屏遮罩 + flex 居中面板，无 webfont/外部资源 */
      #status {
        position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6);
        display: flex; align-items: center; justify-content: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        /* 压过 xterm 内部元素（z-index 最高 11），确保遮罩与链接可点 */
        z-index: 1000;
      }
      #status[hidden] { display: none; }
      /* #login 登录视图遮罩（2026-09-13 表单登录）：与 #status 同语言（全屏遮罩 +
         居中面板），独立元素——仅无有效会话时展示；样式复用状态面板变量，无外部资源。 */
      #login {
        position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6);
        display: flex; align-items: center; justify-content: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        z-index: 1000;
      }
      #login[hidden] { display: none; }
      #login-form { display: flex; flex-direction: column; gap: 12px; }
      #login-form label { font-size: 12px; color: #a3a3a3; display: flex; flex-direction: column; gap: 4px; }
      #login-form input {
        padding: 8px; border-radius: 4px; border: 1px solid #2a2a2a;
        background: #0d0d0d; color: #ffffff; font-size: 14px; font-family: inherit;
      }
      #login-form button {
        margin-top: 4px; padding: 8px 12px; border-radius: 4px; border: 1px solid #2a2a2a;
        background: #262626; color: #ffffff; font-size: 14px; cursor: pointer; font-family: inherit;
      }
      #login-error { margin-top: 8px; font-size: 12px; color: #e08a8a; min-height: 1em; }
      #login-error[hidden] { display: none; }
      .status-panel {
        max-width: 480px; padding: 24px; border-radius: 8px;
        background: #161616; border: 1px solid #2a2a2a;
      }
      .status-title { font-size: 16px; font-weight: 600; line-height: 1.2; color: #ffffff; }
      .status-body { margin-top: 8px; font-size: 14px; font-weight: 400; line-height: 1.5; color: #a3a3a3; }
      .status-hint { margin-top: 16px; font-size: 12px; font-weight: 400; line-height: 1.5; color: #a3a3a3; }
      .status-hint a { color: #729fcf; }
      /* resize 浮层（FE-06 resize 期间右上角 COLSxROWS，D-17 默认开）：样式逐字按
         UI-SPEC §Resize Overlay Spec；内容由 main.ts onResize handler 驱动显隐
         （600ms 静止后 opacity 0，经 transition 200ms 淡出）。
         z-index 序：浮层 900 < tooltip 901 < 状态面板 1000（终态最高层不变） */
      #resize-overlay {
        position: fixed; top: 8px; right: 8px;
        padding: 4px 8px;
        background: rgba(0, 0, 0, 0.6); color: #ffffff; border-radius: 4px;
        font-size: 12px; font-weight: 400; line-height: 1.5;
        /* 与 main.ts 构造选项 fontFamily 同栈（终端等宽） */
        font-family: Menlo, Monaco, "Cascadia Mono", Consolas, "DejaVu Sans Mono", "Liberation Mono", "Courier New", monospace;
        pointer-events: none; user-select: none; z-index: 900;
        transition: opacity 200ms ease;
      }
      #resize-overlay[hidden] { display: none; }
      /* link tooltip（FE-04 hover 展示真实 URL，D-06 钓鱼辨别）：div 由 JS 创建于 Terminal.element
         内并带 xterm-hover class（核心 hover 路径对该 class 提前 return 防抖动） */
      .xterm-hover {
        position: fixed; padding: 4px 8px;
        background: #161616; border: 1px solid #2a2a2a; border-radius: 4px;
        color: #ffffff; font-size: 12px; font-weight: 400; line-height: 1.5;
        /* 与 main.ts 构造选项 fontFamily 同栈（终端等宽） */
        font-family: Menlo, Monaco, "Cascadia Mono", Consolas, "DejaVu Sans Mono", "Liberation Mono", "Courier New", monospace;
        max-width: 480px; word-break: break-all; /* 长 URL 折行展示全文不截断——钓鱼辨别需完整 URL */
        pointer-events: none; z-index: 901; display: none;
      }
    </style>
  </head>
  <body>
    <!-- 页面共三个顶层元素：#terminal（始终存在）、#status（默认 hidden）、#resize-overlay（默认 hidden，FE-06） -->
    <div id="terminal"></div>
    <!-- R2（D-18②）：#status 容器加 alert 角色单属性——隐含 aria-live=assertive +
         aria-atomic=true，hidden 移除时整个面板内容向辅助技术播报（C-1..C-10 与
         Reconnecting 全族一次获得，非逐面板属性）；零视觉影响零 CSS 改动。Reconnecting
         1Hz 倒计时更新在 assertive 语义下的重读边界见 09-UI-SPEC §D-18 ② 已知边界
         登记（真实 AT 播报/节流行为属平台原生豁免面） -->
    <div id="status" role="alert" hidden>
      <div class="status-panel">
        <div class="status-title" id="status-title"></div>
        <div class="status-body" id="status-body"></div>
        <div class="status-hint" id="status-hint"></div>
      </div>
    </div>
    <!-- UI-SPEC §Page Shell 增量：resize 浮层为 body 直属第三个顶层元素，默认 hidden -->
    <div id="resize-overlay" hidden></div>
    <!-- 登录视图（2026-09-13 表单登录）：#login 为第四个顶层元素，默认 hidden；
         /api/attach 401（无会话）时由 main.ts showLogin() 展示。 -->
    <div id="login" hidden>
      <div class="status-panel">
        <div class="status-title">Sign in</div>
        <div class="status-body">Enter the operator credentials to access this terminal.</div>
        <form id="login-form" autocomplete="on">
          <label>Username<input id="login-user" name="user" type="text" autocomplete="username" autocapitalize="off" autocorrect="off" required /></label>
          <label>Password<input id="login-pass" name="pass" type="password" autocomplete="current-password" required /></label>
          <button type="submit">Sign in</button>
        </form>
        <div id="login-error" hidden></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
