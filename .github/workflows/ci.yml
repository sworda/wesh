name: ci
on: [push, pull_request]
jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest] # darwin leg 同时承担 kqueue 运行时裁决（Q1，PATTERNS 注意 6）
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      # 注意：不设 CGO_ENABLED（保持默认启用）——-race 需要 cgo（Pitfall 5；该变量只属于 Phase 9 goreleaser 发布构建）
      # -v：展开单测试 PASS/SKIP——Q1 裁决需读 TestKqueueExitZombieRace 的具体结果（包级 ok 无法区分 PASS/skip）
      - run: go test -race -count=1 -v ./...
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.10
        with:
          # web/package.json 无 packageManager 字段，显式钉版（与本地一致，lockfileVersion 9.0）
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm -C web install --frozen-lockfile
      - run: pnpm -C web build # tsc 类型检查 + vite 构建一体（D-18 构建顺序的 CI 固化）
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      # D-10 CI 短跑回归门（09-02）：两目标两次独立调用——-fuzz 每次只能匹配单包单目标
      #（工具链结构性约束，RESEARCH Pitfall 4）；不加竞态检测器（与 go leg 并行墙钟 +60-70s）。
      # 种子/崩溃语料随 go leg 常规全量测试零时长回归（既有行覆盖，testdata/fuzz 入库 D-10）。
      - run: go test -fuzz=FuzzDecodeHello -fuzztime=60s ./internal/proto/
      - run: go test -fuzz=FuzzDecodeFileConfig -fuzztime=60s ./cmd/wesh/
